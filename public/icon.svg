<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="chordGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fa2d48"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa2d48" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.1"/>

  <!-- Ambient background glow circle -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#neonGlow)"/>

  <!-- Stylized BitChord Waveform & Musical Chord Symbol -->
  <g filter="url(#neonGlow)">
    <!-- Harmonic Sound Wave Bars -->
    <rect x="120" y="210" width="22" height="92" rx="11" fill="url(#chordGrad)"/>
    <rect x="160" y="150" width="22" height="212" rx="11" fill="url(#chordGrad)"/>
    <rect x="200" y="240" width="22" height="112" rx="11" fill="url(#chordGrad)"/>
    
    <!-- Central Chord Note Stem -->
    <path d="M 280 120 C 330 120, 370 140, 392 180 C 400 196, 396 216, 380 220 C 364 224, 350 212, 342 196 C 330 172, 308 160, 280 160 L 280 320 C 280 348, 258 370, 230 370 C 202 370, 180 348, 180 320 C 180 292, 202 270, 230 270 C 242 270, 252 274, 260 282 L 260 140 C 260 129, 269 120, 280 120 Z" fill="url(#chordGrad)"/>

    <rect x="360" y="250" width="22" height="82" rx="11" fill="url(#chordGrad)"/>
    <rect x="400" y="220" width="22" height="132" rx="11" fill="url(#chordGrad)"/>
  </g>

  <!-- High-Res Audio Badge Overlay -->
  <rect x="176" y="415" width="160" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="256" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">HI-RES LOSSLESS</text>
</svg>
